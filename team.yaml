# team.yaml — declarative roster the ScrumMaster reads at dispatch.
# Generated by generate-team v3 (harness/gen_team.py). Regenerate on stack/direction change.

meta:
  project: simple-dev
  direction_digest: "minimal accountable dev harness; Python scripts + markdown skills; single-user; next: graphify context, SM orchestration, self-pruning Governor"

disciplines:
  python: { subagent_type: python-pro, via: table, evidence: **/*.py }
  markdown: { subagent_type: technical-writer, via: table, evidence: .claude/skills/**/*.md }

roles:
  create-story:
    default: { subagent_type: general-purpose, skills: [create-story], context: ["affected {touches}", epics.md] }
  test-author:
    by_discipline:
      python: { subagent_type: python-pro, skills: [testarch-atdd] }
      markdown: { subagent_type: technical-writer, skills: [testarch-atdd] }
    default: { subagent_type: test-automator, skills: [testarch-atdd] }
  implementer:
    by_discipline:
      python: { subagent_type: python-pro, skills: [dev-story] }
      markdown: { subagent_type: technical-writer, skills: [dev-story] }
    default: { subagent_type: general-purpose, skills: [dev-story] }
  reviewer:
    default: { subagent_type: code-reviewer, skills: [code-review, bmad-review-edge-case-hunter, bmad-review-adversarial-general], context: ["affected {touches}"] }
  tracer:
    default: { subagent_type: qa-expert, skills: [testarch-trace] }

gaps: []
